<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thing|SCMS Students</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
             height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 420px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 
                        0 0 35px rgba(16, 185, 129, 0.5);
        }

        .card-header {
            transform: translateZ(30px);
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(16, 185, 129, 0.4);
            margin-bottom: 15px;
        }

        h2 {
            color: #f8fafc;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            transform: translateZ(20px);
        }

        .card-footer {
            transform: translateZ(30px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .stats {
            color: #34d399;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn {
            background: #10b981;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #34d399;
        }

        .glow-orb {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background: #10b981;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card" id="tiltCard">
        <div class="glow-orb"></div>
        <div class="card-header">
            <span class="badge">Thing</span>
            <h2>Thing Thing</h2>
            <p>Thing that things</p>
        </div>
        <div class="card-footer">
            <span class="stats">It is in fact a thing</span>
            <button class="btn" onclick="alert('You clicked the button :O')">Click Me</button>
        </div>
    </div>

    <script>
        const card = document.getElementById('tiltCard');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -15; // Max tilt deg
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
        });
    </script>
</body>
</html>
