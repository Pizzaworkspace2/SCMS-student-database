<html>
  <head> <link rel="stylesheet" href="soundboard.css">
  <title> Soundboard|SCMS Students</title></head>
  <body>
<h1> <center>Sound Board</center></h1>
<p><center>(Please do not blare in class at max volume)</center></p>
<div class="row">
  
 <button class="button row" onclick="playFahhh()">Fahhh</button>
<audio id="fahhh" src="fahhh.mp3"></audio>

<button class="button row" onclick="playHeli()">Helicopter</button>
<audio id="heli" src="helicopter.mp3"></audio>

  <button class="button row" onclick="playShutdown()">Windows XP shutdown</button>
<audio id="shutdown" src="shutdown.mp3"></audio>

  <button class="button row" onclick="playPipe()">Metal pipe</button>
<audio id="pipe" src="pipe.mp3"></audio>

  <button class="button row" onclick="playVineboom()">Vine boom</button>
<audio id="vineboom" src="vineboom.mp3"></audio>

<script>
  const fahhhAudio = document.getElementById('fahhh');
  const heliAudio = document.getElementById('heli');
  const shutdownAudio = document.getElementById('shutdown');
  const pipeAudio = document.getElementById('pipe');
  const vineboomAudio = document.getElementById('vineboom');

  function playFahhh() {
    fahhhAudio.play();
  }

  function playHeli() {
    heliAudio.play();
  }
  function playShutdown() {
    shutdownAudio.play();
  }
  function playPipe() {
    pipeAudio.play();
  }
   function playVineboom() {
    vineboomAudio.play();
  }
</script>


  
</div>
  </body>
</html>
